<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNG-VAULT</title><style>:root{--bg:#f4f6fa;--panel:#fff;--ink:#152033;--muted:#69778d;--line:#dce3ed;--accent:#3155e7;--nav:#101a2c;--danger:#b42318}*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}aside{position:fixed;inset:0 auto 0 0;width:270px;background:var(--nav);color:#fff;padding:26px 18px;height:100vh}aside h2{font-size:25px;margin:0}aside p{color:#9fb0c8;margin:5px 0 25px}.nav{display:grid;gap:7px}.nav button,button{font:inherit;border:1px solid transparent;border-radius:10px;padding:12px 14px;cursor:pointer}.nav button{background:transparent;color:#d8e1ef;text-align:left}.nav button.active,.nav button:hover{background:#ffffff12}.primary{background:var(--accent);color:#fff}.secondary{background:#fff;border-color:var(--line)}.danger{background:#fff0ef;color:var(--danger);border-color:#ffd1cd}main{margin-left:270px;padding:32px;max-width:1400px}h1{font-size:32px;margin:0 0 6px}.muted{color:var(--muted)}.toolbar,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar{margin:20px 0}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:6px;font-weight:600}input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:9px;padding:11px;width:100%}.wide{grid-column:1/-1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{font-size:28px;font-weight:750}.item{border:1px solid var(--line);border-radius:12px;padding:16px;margin:10px 0}.item h4{margin:0 0 5px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#edf1ff;font-size:12px;margin-right:5px}.error{color:var(--danger)}.success{color:#087443}#message{min-height:30px}.drop{border:2px dashed #c9d3e2;border-radius:14px;padding:22px;background:#fafbfc}@media(max-width:800px){aside{position:relative;width:auto;height:auto}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}main{margin:0;padding:18px}.grid,.fields{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><aside><h2>UNG-VAULT</h2><p>Encrypted information control</p><div class="nav"><button data-view="myvault" class="active">My Vault</button><button data-view="share">Secure Sharing</button><button data-view="files">Encrypt / Decrypt</button><button data-view="objects">Protected Objects</button><button data-view="admin">Admin Portal</button><button data-view="audit">Audit Integrity</button></div></aside><main><h1 id="title">My Vault</h1><p class="muted" id="desc">Encrypted persistent file storage.</p><div id="auth"></div><div class="toolbar"><button class="secondary" id="refresh">↻ Refresh</button><button class="secondary" id="signout" hidden>Sign out</button></div><div id="message"></div><section id="content"></section></main><script>const $=x=>document.getElementById(x),esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;');let token='';function msg(t,e=false){$('message').textContent=t;$('message').className=e?'error':'success'}async function api(path,method='GET',body,form=false){let h={};if(token)h.Authorization='Bearer '+token;if(body&&!form)h['Content-Type']='application/json';let r=await fetch(path,{method,headers:h,body:body?(form?body:JSON.stringify(body)):undefined,cache:'no-store'});if(!r.ok){let d;try{d=await r.json()}catch{}throw Error(d?.detail||'Operation failed ('+r.status+')')}return r}function download(r,fallback){return r.blob().then(blob=>{let cd=r.headers.get('content-disposition')||'',m=cd.match(/filename\*=UTF-8''([^;]+)/i),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=m?decodeURIComponent(m[1]):fallback;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)})}function login(){let b=document.createElement('section');b.className='card';b.innerHTML='<h3>Sign in with JANUS</h3><form id="login" class="fields"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="primary wide">Sign in</button></form>';$('auth').replaceChildren(b);$('login').onsubmit=async e=>{e.preventDefault();try{let r=await api('/ui/session','POST',Object.fromEntries(new FormData(e.target))),d=await r.json();token=d.access_token;$('auth').innerHTML='<p>Signed in · '+esc(d.identity?.display_name||'UNG Identity')+'</p>';$('signout').hidden=false;show('myvault')}catch(x){msg(x.message,true)}}}function sethead(t,d){$('title').textContent=t;$('desc').textContent=d}async function show(v){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));let c=$('content');if(!token){c.innerHTML='<section class="card">Sign in to continue.</section>';return}try{if(v==='myvault'){sethead('My Vault','Upload, store and retrieve encrypted files.');let r=await api('/vault/files'),files=await r.json();c.innerHTML='<section class="card"><h3>Upload encrypted file</h3><form id="upload" class="fields"><label class="wide">File<input name="file" type="file" required></label><label>Classification<select name="classification"><option>internal</option><option>confidential</option><option>restricted</option><option>top_secret</option></select></label><label>Compartment<input name="compartment" required placeholder="operations"></label><button class="primary wide">Encrypt & store</button></form></section><section class="card"><h3>Stored files ('+files.length+')</h3><div id="vaultlist">'+(files.map(f=>'<div class="item"><h4>'+esc(f.name)+'</h4><span class="pill">'+esc(f.classification)+'</span><span class="pill">'+esc(f.compartment)+'</span><p class="muted">'+esc(f.size_bytes)+' bytes · '+esc(f.id)+'</p><div class="actions"><button class="secondary dl" data-id="'+esc(f.id)+'">Download</button><button class="secondary share" data-id="'+esc(f.id)+'">Share</button></div></div>').join('')||'<p class="muted">No files stored yet.</p>')+'</div></section>';$('upload').onsubmit=async e=>{e.preventDefault();try{let fd=new FormData(e.target);await api('/vault/files','POST',fd,true);msg('File encrypted and stored.');show('myvault')}catch(x){msg(x.message,true)}};document.querySelectorAll('.dl').forEach(b=>b.onclick=async()=>{try{await download(await api('/vault/files/'+b.dataset.id+'/download'),'vault-file');msg('File downloaded.')}catch(x){msg(x.message,true)}});document.querySelectorAll('.share').forEach(b=>b.onclick=()=>{show('share');setTimeout(()=>{let x=$('shareFile');if(x)x.value=b.dataset.id},0)});return}if(v==='share'){sethead('Secure Sharing','Create revocable access-code protected shares.');c.innerHTML='<section class="card"><h3>Create secure share</h3><form id="shareForm" class="fields"><label>File ID<input id="shareFile" name="file_id" required></label><label>Access code<input name="access_code" minlength="8" required></label><label>Expires in minutes<input name="expires_minutes" type="number" value="60" min="1" max="10080"></label><button class="primary wide">Create secure share</button></form></section><section class="card"><h3>Open received share</h3><form id="openShare" class="fields"><label>Share ID<input name="id" required></label><label>Access code<input name="access_code" required></label><button class="secondary wide">Verify access</button></form><pre id="shareResult"></pre></section>';$('shareForm').onsubmit=async e=>{e.preventDefault();try{let d=Object.fromEntries(new FormData(e.target));d.expires_minutes=Number(d.expires_minutes);let out=await (await api('/vault/shares','POST',d)).json();$('shareResult').textContent=JSON.stringify(out,null,2);msg('Secure share created.')}catch(x){msg(x.message,true)}};$('openShare').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),id=d.id;delete d.id;try{$('shareResult').textContent=JSON.stringify(await (await api('/vault/shares/'+encodeURIComponent(id)+'/open','POST',d)).json(),null,2);msg('Share access verified.')}catch(x){msg(x.message,true)}};return}if(v==='files'){sethead('Encrypt / Decrypt','Create or restore portable UNG-VAULT packages.');c.innerHTML='<section class="card drop"><h3>Portable file encryption</h3><input id="file" type="file"><div class="actions"><button id="enc" class="primary">Encrypt file</button><button id="dec" class="secondary">Decrypt file</button></div></section>';async function run(mode){let f=$('file').files[0];if(!f)return msg('Choose a file.',true);let fd=new FormData();fd.append('file',f);try{await download(await api('/vault/files/'+mode,'POST',fd,true),mode==='encrypt'?f.name+'.ungvault':f.name.replace(/\.ungvault$/,''));msg('File '+(mode==='encrypt'?'encrypted.':'decrypted.'))}catch(x){msg(x.message,true)}}$('enc').onclick=()=>run('encrypt');$('dec').onclick=()=>run('decrypt');return}if(v==='objects'){sethead('Protected Objects','Store encrypted protected values.');c.innerHTML='<section class="card"><form id="obj" class="fields"><label>Name<input name="name" required></label><label>Compartment<input name="compartment" required></label><label>Classification<select name="classification"><option>internal</option><option>confidential</option><option>restricted</option><option>top_secret</option></select></label><label class="wide">Protected value<textarea name="value" required></textarea></label><button class="primary wide">Store protected object</button></form></section>';$('obj').onsubmit=async e=>{e.preventDefault();try{let d=await(await api('/vault/objects','POST',Object.fromEntries(new FormData(e.target)))).json();msg('Object stored: '+d.id)}catch(x){msg(x.message,true)}};return}if(v==='admin'){sethead('VAULT Admin Portal','Live metadata, sharing and audit controls.');let [fr,sr,ar]=await Promise.all([api('/admin/files'),api('/admin/shares'),api('/admin/audit')]),[files,shares,audit]=await Promise.all([fr.json(),sr.json(),ar.json()]);c.innerHTML='<div class="grid"><section class="card"><div class="stat">'+files.length+'</div><div>Files</div></section><section class="card"><div class="stat">'+shares.length+'</div><div>Shares</div></section><section class="card"><div class="stat">'+audit.length+'</div><div>Recent audit events</div></section></div><section class="card"><h3>Share controls</h3>'+(shares.map(s=>'<div class="item"><b>'+esc(s.id)+'</b> · Level '+esc(s.security_level)+'<p class="muted">File '+esc(s.file_id)+' · '+(s.revoked_at?'REVOKED':'Active')+'</p>'+(s.revoked_at?'':'<button class="danger revoke" data-id="'+esc(s.id)+'">Revoke share</button>')+'</div>').join('')||'<p>No shares.</p>')+'</section><section class="card"><h3>File inventory</h3>'+files.map(f=>'<div class="item"><b>'+esc(f.name)+'</b> <span class="pill">'+esc(f.classification)+'</span><p class="muted">Owner '+esc(f.created_by)+' · '+esc(f.size_bytes)+' bytes</p></div>').join('')+'</section><section class="card"><h3>Audit activity</h3>'+audit.slice(0,100).map(a=>'<div class="item"><b>#'+esc(a.seq)+' '+esc(a.action)+'</b><p class="muted">'+esc(a.actor)+' · '+esc(a.object_id||'system')+'</p></div>').join('')+'</section>';document.querySelectorAll('.revoke').forEach(b=>b.onclick=async()=>{try{await api('/admin/shares/'+b.dataset.id+'/revoke','POST');msg('Share revoked.');show('admin')}catch(x){msg(x.message,true)}});return}sethead('Audit Integrity','Verify the tamper-evident audit chain.');let d=await(await api('/audit/verify')).json();c.innerHTML='<section class="card"><h3>Audit chain</h3><div class="stat">'+(d.valid?'VALID':'FAILED')+'</div><pre>'+esc(JSON.stringify(d,null,2))+'</pre></section>'}catch(x){c.innerHTML='<section class="card"><p class="error">'+esc(x.message)+'</p></section>';msg(x.message,true)}}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));$('refresh').onclick=()=>show(document.querySelector('.nav button.active')?.dataset.view||'myvault');$('signout').onclick=async()=>{try{await api('/ui/session','DELETE')}catch{}token='';$('signout').hidden=true;login();show('myvault')};login();show('myvault');</script></body></html>
