<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNG-VAULT</title><style>
:root{--bg:#f3f5f8;--panel:white;--ink:#172236;--muted:#66748a;--line:#dce3ec;--accent:#2e50e9;--nav:#101b2e}*{box-sizing:border-box}body{margin:0;font:16px system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:12px 17px;border-radius:10px;min-height:44px}button:hover{border-color:var(--accent)}button:disabled{opacity:.55;cursor:wait}.primary{background:var(--accent);color:white;border-color:var(--accent)}aside{position:fixed;inset:0 auto 0 0;width:255px;background:var(--nav);color:white;padding:27px 20px;overflow:auto}aside h2{margin:0 0 6px;font-size:24px}aside p{font-size:13px;color:#a9b7cb;margin-bottom:28px}nav{display:grid;gap:7px}nav button{background:transparent;color:#c5d1e2;border-color:transparent;text-align:left}nav button.active{background:#ffffff18;color:white;border-color:#ffffff20}main{margin-left:255px;padding:30px 34px;max-width:1800px}header{display:flex;justify-content:space-between;gap:16px;align-items:start}h1{font-size:32px;letter-spacing:-1px;margin:0}h3{margin-top:0}p{line-height:1.5}.muted{color:var(--muted)}.badge{border:1px solid var(--line);background:var(--panel);padding:9px 12px;border-radius:30px;white-space:nowrap;font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:18px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:150px}.stat b{display:block;font-size:28px;margin-top:9px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}label{display:grid;gap:8px;font-size:14px;font-weight:600}input,select,textarea{padding:12px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;width:100%;min-width:0}textarea{min-height:100px}.wide{grid-column:1/-1}.leg{border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}.error{color:#b42318}.success{color:#087443}#message{padding:12px 0;min-height:45px}.scroll{overflow:auto;max-height:65vh}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:13px 12px;border-bottom:1px solid var(--line);text-align:left;max-width:350px;overflow-wrap:anywhere}th{color:var(--muted);font-size:12px;text-transform:uppercase;position:sticky;top:0;background:var(--panel)}td details{min-width:160px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px ui-monospace,monospace}.empty{padding:25px;color:var(--muted)}#search{max-width:340px}.notice{font-size:13px}.result{display:grid;gap:12px}dl{display:grid;grid-template-columns:170px 1fr;margin:0;gap:12px}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}.terminal{--bg:#03150d;--panel:#071f14;--ink:#77f6a4;--muted:#64a77e;--line:#1f5839;--accent:#137043;--nav:#021108;font-family:ui-monospace,SFMono-Regular,monospace}.terminal aside,.terminal .card,.terminal button,.terminal input,.terminal select{border-radius:4px}.terminal h1{font-size:29px}.terminal nav button.active{color:#86ffb2}.terminal .primary{color:#c2ffd9}.terminal .success{color:#77f6a4}.terminal .error{color:#ff9393}.terminal aside{border-right:1px solid var(--line)}
@media(max-width:850px){aside{position:relative;width:auto;padding:18px}aside p{margin:4px 0 14px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}main{margin:0;padding:22px 16px}h1{font-size:27px}.fields{grid-template-columns:1fr}.badge{white-space:normal}header{flex-wrap:wrap}dl{grid-template-columns:1fr}.card{padding:18px}.stats .stat{min-width:125px}}
</style></head><body><aside><h2>UNG-VAULT</h2><p id="subtitle"></p><nav id="nav"></nav></aside><main><header><div><h1 id="heading"></h1><p id="description" class="muted"></p></div><span class="badge" id="health">Checking service…</span></header><div id="auth"></div><div class="toolbar"><button id="refresh">↻ Refresh</button><input id="search" placeholder="Search loaded records" aria-label="Search records"><button id="signout" hidden>Sign out</button></div><div id="message" role="status" aria-live="polite"></div><div class="stats" id="stats"></div><div class="card" id="content"></div><p class="muted notice" id="notice"></p></main><script>
const C={"title": "UNG-VAULT", "subtitle": "Secure object management", "description": "Store protected objects, retrieve authorized values and verify the audit chain.", "health": "/ready", "auth": true, "resources": [["Verify audit chain", "/audit/verify"]], "actions": [{"title": "Store protected object", "path": "/vault/objects", "fields": [{"name": "name", "label": "Object name", "kind": "text", "options": null, "optional": false}, {"name": "compartment", "label": "Compartment", "kind": "text", "options": null, "optional": false}, {"name": "classification", "label": "Classification", "kind": "select", "options": ["internal", "confidential", "restricted", "top_secret", "public"], "optional": false}, {"name": "value", "label": "Protected value", "kind": "secret", "options": null, "optional": false}], "method": "POST"}, {"title": "Retrieve protected object", "path": "/vault/objects/{object_id}", "fields": [{"name": "object_id", "label": "Object ID", "kind": "text", "options": null, "optional": false}], "method": "GET"}], "notice": "JANUS clearance and compartment permissions remain enforced. Retrieved values stay masked until you choose Reveal."};
const $=id=>document.getElementById(id);let token='',selected=0,records=[],busy=false;
if(C.terminal)document.body.classList.add('terminal');$('subtitle').textContent=C.subtitle;$('heading').textContent=C.subtitle;$('description').textContent=C.description;$('notice').textContent=C.notice;
function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}
function msg(text,error=false){$('message').textContent=text;$('message').className=error?'error':'success'}
async function api(path,method='GET',body){const headers={};if(token)headers.Authorization='Bearer '+token;if(body!==undefined)headers['Content-Type']='application/json';const r=await fetch(path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});let data;try{data=await r.json()}catch{throw Error('Service returned an unreadable response')}if(!r.ok){if(r.status===401&&path!='/ui/session')clearSession();throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail||data))}return data}
function clearSession(){token='';records=[];$('stats').replaceChildren();$('content').replaceChildren(el('p','Sign in to load protected records.'));$('signout').hidden=true;showLogin()}
function showLogin(){if(!C.auth)return;$('auth').replaceChildren();const box=el('section');box.className='card';box.append(el('h3','Sign in with UNG Identity'));const form=el('form');form.className='fields';for(const [name,label,type] of [['email','Email','email'],['password','Password','password']]){const l=el('label',label),input=el('input');input.name=name;input.type=type;input.required=true;input.autocomplete=type==='password'?'current-password':'username';l.append(input);form.append(l)}const b=el('button','Sign in');b.className='primary';form.append(b);form.onsubmit=async e=>{e.preventDefault();b.disabled=true;try{const body=Object.fromEntries(new FormData(form));const data=await api('/ui/session','POST',body);token=data.access_token;form.reset();$('auth').replaceChildren(el('p','Signed in · '+(data.identity?.display_name||'UNG Identity')));$('signout').hidden=false;msg('Identity verified. Loading live records.');await load()}catch(error){msg(error.message,true)}finally{b.disabled=false}};box.append(form);$('auth').append(box)}
function cell(value){if(value===null||value===undefined)return el('span','—');if(typeof value==='object'){const d=el('details');d.append(el('summary',Array.isArray(value)?value.length+' entries':'Details'));d.append(el('pre',JSON.stringify(value,null,2)));return d}return el('span',String(value))}
function renderRecords(data){records=Array.isArray(data)?data:Array.isArray(data.results)?data.results:Array.isArray(data.alternatives)?data.alternatives:null;if(!records){renderObject(data);return}drawTable()}
function drawTable(){const panel=$('content');panel.replaceChildren(el('h3',C.resources[selected]?.[0]||'Results'));const query=$('search').value.toLowerCase();const rows=records.filter(row=>JSON.stringify(row).toLowerCase().includes(query));if(!rows.length){panel.append(el('p',query?'No matching records.':'No records returned.'));return}const wrap=el('div');wrap.className='scroll';const table=el('table'),head=el('thead'),tr=el('tr');const keys=[...new Set(rows.flatMap(row=>Object.keys(row)))].filter(k=>!['envelope','password_hash','value','token','access_token'].includes(k));keys.forEach(k=>tr.append(el('th',k.replaceAll('_',' '))));head.append(tr);table.append(head);const tbody=el('tbody');for(const row of rows){const line=el('tr');for(const key of keys){const td=el('td');td.append(cell(row[key]));line.append(td)}tbody.append(line)}table.append(tbody);wrap.append(table);panel.append(wrap);panel.append(el('p',rows.length+' records · loaded '+new Date().toLocaleTimeString()))}
function renderObject(data){records=null;const box=$('content');box.replaceChildren(el('h3','Operation result'));const dl=el('dl');for(const [key,value] of Object.entries(data)){if(['token','access_token','envelope','password_hash'].includes(key))continue;dl.append(el('dt',key.replaceAll('_',' ')));const dd=el('dd');if(key==='value'){const mask=el('span','••••••••'),reveal=el('button','Reveal');let shown=false;reveal.onclick=()=>{shown=!shown;mask.textContent=shown?String(value):'••••••••';reveal.textContent=shown?'Hide':'Reveal'};dd.append(mask,el('br'),reveal)}else dd.append(cell(value));dl.append(dd)}box.append(dl)}
async function health(){try{const d=await api(C.health);const ok=d.ready===true||d.status==='ready'||d.status==='ok';$('health').textContent=ok?'● Service online'+(d.database==='connected'?' · Database connected':''):'● Service degraded';}catch(e){$('health').textContent='● Service unavailable';msg(e.message,true)}}
async function load(){if(busy)return;if(C.auth&&!token){msg('Sign in to load live data.');return}busy=true;$('refresh').disabled=true;try{const resource=C.resources[selected];if(resource){renderRecords(await api(resource[1]));msg('Live '+resource[0].toLowerCase()+' loaded.')}if(C.summary){const d=await api(C.summary);$('stats').replaceChildren();for(const key of ['distinct_skus','units_on_hand','movements']){const n=el('div');n.className='card stat';n.append(el('span',key.replaceAll('_',' ')),el('b',d[key]??'—'));$('stats').append(n)}}}catch(e){msg(e.message,true)}finally{busy=false;$('refresh').disabled=false}}
function field(spec,parent){const l=el('label',spec.label);if(spec.kind==='hidden'){const input=el('input');input.type='hidden';input.name=spec.name;input.value=spec.options[0];parent.append(input);return}if(spec.kind==='legs'){l.className='wide';const holder=el('div');let count=0;function add(){const group=el('div');group.className='leg';group.dataset.leg='true';group.append(el('h4','Transport leg '+(++count)));const grid=el('div');grid.className='fields';for(const s of [{"name": "mode", "label": "Transport mode", "kind": "select", "options": ["road", "rail", "ocean", "air"], "optional": false}, {"name": "origin", "label": "Origin", "kind": "text", "options": null, "optional": false}, {"name": "destination", "label": "Destination", "kind": "text", "options": null, "optional": false}, {"name": "distance_km", "label": "Distance (km)", "kind": "number", "options": null, "optional": false}, {"name": "cargo_tons", "label": "Cargo (tons)", "kind": "number", "options": null, "optional": false}])field(s,grid);const remove=el('button','Remove leg');remove.type='button';remove.onclick=()=>group.remove();group.append(grid,remove);holder.append(group)}add();const b=el('button','+ Add transport leg');b.type='button';b.onclick=add;l.append(holder,b);parent.append(l);return}let input=el(spec.kind==='select'?'select':spec.kind==='secret'?'textarea':'input');if(spec.kind==='select')for(const v of spec.options){const o=el('option',v);o.value=v;input.append(o)}else if(spec.kind!=='secret'){input.type=['number','integer'].includes(spec.kind)?'number':'text';if(['number','integer'].includes(spec.kind))input.step=spec.kind==='integer'?'1':'any'}input.name=spec.name;input.required=!spec.optional;input.dataset.kind=spec.kind;input.autocomplete='off';if(spec.kind==='secret'){input.spellcheck=false;l.className='wide'}l.append(input);parent.append(l)}
function extract(root){const data={};for(const input of root.querySelectorAll('input,select,textarea')){if(input.closest('[data-leg]')&&root.tagName==='FORM')continue;if(input.value==='')continue;data[input.name]=['number','integer'].includes(input.dataset.kind)?Number(input.value):input.value}return data}
function showAction(a){selected=-1;records=null;$('search').value='';const box=$('content');box.replaceChildren(el('h3',a.title));const form=el('form');form.className='fields';a.fields.forEach(s=>field(s,form));const submit=el('button',a.title);submit.className='primary wide';form.append(submit);form.onsubmit=async e=>{e.preventDefault();if(!form.reportValidity())return;submit.disabled=true;try{let body=extract(form);const legs=[...form.querySelectorAll('[data-leg]')];if(a.fields.some(s=>s.kind==='legs')){if(!legs.length)throw Error('Add at least one transport leg');body.legs=legs.map(extract)}let path=a.path.replace(/\{(\w+)\}/g,(_,key)=>{if(!body[key])throw Error('Missing '+key);const value=encodeURIComponent(body[key]);delete body[key];return value});const data=await api(path,a.method,a.method==='GET'?undefined:body);form.querySelectorAll('textarea').forEach(x=>x.value='');renderRecords(data);msg(a.title+' completed.')}catch(error){msg(error.message,true)}finally{submit.disabled=false}};box.append(form);msg('Complete the fields and submit to run this operation.')}
for(let i=0;i<C.resources.length;i++){const b=el('button',C.resources[i][0]);b.onclick=()=>{selected=i;document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');load()};if(i===0)b.classList.add('active');$('nav').append(b)}for(const a of C.actions){const b=el('button','+ '+a.title);b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');showAction(a)};$('nav').append(b)}
$('refresh').onclick=()=>{health();load()};$('search').oninput=()=>{if(records)drawTable()};$('signout').onclick=async()=>{try{await api('/ui/session','DELETE');clearSession();msg('Signed out.')}catch(e){clearSession();msg('Local session cleared; remote revocation failed: '+e.message,true)}};
document.addEventListener('keydown',e=>{if(!C.terminal)return;if(e.key==='F5'){e.preventDefault();health();load()}if(e.key==='F3'||e.key==='F12'){e.preventDefault();selected=0;load()}});health();showLogin();if(!C.auth)load();else $('content').textContent='Sign in to load protected records.';
</script></body></html>
